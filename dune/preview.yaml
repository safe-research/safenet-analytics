# Preview dashboards for pull requests (docs/preview.md). Each pull request has its own track,
# pr-<number>, with its own private dashboards and queries under the `safe` team:
#
#   track "pr-<n>" -> "Safenet — Preview (pr-<n>)", safe/safenet-preview-pr-<n>, safe/safenet-<key>-preview-pr-<n>
#
# When a pull request is closed (merged or not), the Preview auto-cleanup workflow removes its
# track. Set `track: <name>` on a branch to let several pull requests of one work package share a
# preview instead; a shared track is cleaned up when its last open pull request closes.
# Runs outside a pull request use track "default".

# Preview dashboards must be private. The deployer stops instead of creating public dashboards.
private: true

# Preview queries are public: their SQL is that of the public production queries, their names start
# with [Preview <track>], and private queries count against the team's limit (reached in October
# 2026). Set to true to create them private; the deployer then stops if one comes out public.
private_queries: false

# Cost caps for executing preview queries after a deploy. Only queries whose SQL changed since
# their last preview execution, and that differ from production (run-preview --baseline), run. An
# execution that exceeds the timeout is cancelled.
execution:
  performance: medium
  timeout_minutes: 10
  max_credits_per_execution: 25
  max_credits_per_run: 100
