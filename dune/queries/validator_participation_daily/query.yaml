name: "Safenet: validator participation per day"
description: >
  Safenet validators' observed signing participation per UTC day over the last 30 days: recognised
  signature shares / completed production signing ceremonies of their groups. Days without eligible
  ceremonies are blank. Managed in github.com/safe-research/safenet-analytics
  (docs/metrics/validators.md).
private: false
tags: [safenet]
refresh: daily
performance: medium

visualizations:
  heatmap:
    name: Observed signing participation per day, % of eligible ceremonies (last 30 days)
    type: pivot
    description: >
      One row per validator. Blank: no eligible ceremony that day (not in the attestation set, or no
      ceremonies). Pending ceremonies are not counted. Signing only counts with the completed
      signature's selection root; an aggregate attestation alone never counts for a validator.
    # Dune's pivot format, as its editor stores it. PivotTable.js-style options (cols, vals,
    # rendererName, ...) crash Dune's renderer; see docs/adding-a-metric.md#visualization-options.
    # Dune's pivot has no heatmap colouring; the key stays `heatmap` to keep the visualization ID.
    options:
      rows: [{ column_name: validator }]
      columns: [{ column_name: day }]
      values: [{ column_name: participation_pct, agg_type: AVG, numberFormat: "0.0" }]
