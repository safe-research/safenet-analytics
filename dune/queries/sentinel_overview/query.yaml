name: "Safenet: Sentinel overview"
description: >
  Safenet production (Aegis): every Sentinel ever scheduled, its current membership status and its
  all-time participation: eligible requests, commits, valid reveals, participation rate, secure,
  insecure, no-commit and missing responses, reverted calls and last activity. Managed in
  github.com/safe-research/safenet-analytics (docs/metrics/sentinels.md).
private: false
tags: [safenet]
refresh: daily
performance: medium

visualizations:
  table:
    name: Sentinel overview (current status; counts all time)
    type: table
    description: >
      Status is current. Counts are all time, for requests on the Charter's chains whose response
      window has closed. Participation rate = valid reveals / eligible requests. No commit =
      abstained or offline (indistinguishable on chain); commit reverted = tried to commit, but every
      attempt reverted (late or invalid, reason as recorded); missing response = committed, never
      revealed. Reverted calls counts every reverted commit or reveal call.
    options:
      itemsPerPage: 25
      columns:
        - { name: sentinel_link, title: Sentinel, type: normal, alignContent: left, isHidden: false }
        - { name: current_status, title: Status (now), type: normal, alignContent: left, isHidden: false }
        - { name: eligible_requests, title: Eligible requests, type: normal, alignContent: right, isHidden: false }
        - { name: commits, title: Commits, type: normal, alignContent: right, isHidden: false }
        - { name: valid_reveals, title: Valid reveals, type: normal, alignContent: right, isHidden: false }
        - { name: participation_rate, title: Participation, type: normal, alignContent: right, isHidden: false, numberFormat: "0.0%" }
        - { name: secure, title: Secure, type: normal, alignContent: right, isHidden: false }
        - { name: insecure, title: Insecure, type: normal, alignContent: right, isHidden: false }
        - { name: no_commit, title: "No commit (abstain or offline)", type: normal, alignContent: right, isHidden: false }
        - { name: reverted_commit, title: "Commit reverted (late or invalid)", type: normal, alignContent: right, isHidden: false }
        - { name: missing_responses, title: "Missing response (committed, not revealed)", type: normal, alignContent: right, isHidden: false }
        - { name: pending, title: Pending, type: normal, alignContent: right, isHidden: false }
        - { name: reverted_calls, title: "Reverted calls (late or invalid)", type: normal, alignContent: right, isHidden: false }
        - { name: last_revert_reason, title: Last revert reason, type: normal, alignContent: left, isHidden: false }
        - { name: last_activity, title: Last activity (UTC), type: normal, alignContent: left, isHidden: false }
        - { name: address, title: Address, type: normal, alignContent: left, isHidden: true }
        - { name: name, title: name, type: normal, alignContent: left, isHidden: true }
        - { name: last_activity_at, title: last_activity_at, type: normal, alignContent: left, isHidden: true }
        - { name: as_of_time, title: as_of_time, type: normal, alignContent: left, isHidden: true }
        - { name: as_of_block, title: as_of_block, type: normal, alignContent: left, isHidden: true }
        - { name: computed_at, title: computed_at, type: normal, alignContent: left, isHidden: true }
        - { name: through_block, title: through_block, type: normal, alignContent: left, isHidden: true }
  freshness:
    name: Sentinels data as of
    type: table
    options:
      itemsPerPage: 1
      columns:
        - { name: as_of_time, title: Gnosis Chain data as of (UTC), type: normal, alignContent: left, isHidden: false }
        - { name: computed_at, title: Computed (UTC), type: normal, alignContent: left, isHidden: false }
        - { name: sentinel_link, title: sentinel_link, type: normal, alignContent: left, isHidden: true }
        - { name: name, title: name, type: normal, alignContent: left, isHidden: true }
        - { name: address, title: address, type: normal, alignContent: left, isHidden: true }
        - { name: current_status, title: current_status, type: normal, alignContent: left, isHidden: true }
        - { name: eligible_requests, title: eligible_requests, type: normal, alignContent: left, isHidden: true }
        - { name: commits, title: commits, type: normal, alignContent: left, isHidden: true }
        - { name: valid_reveals, title: valid_reveals, type: normal, alignContent: left, isHidden: true }
        - { name: participation_rate, title: participation_rate, type: normal, alignContent: left, isHidden: true }
        - { name: secure, title: secure, type: normal, alignContent: left, isHidden: true }
        - { name: insecure, title: insecure, type: normal, alignContent: left, isHidden: true }
        - { name: no_commit, title: no_commit, type: normal, alignContent: left, isHidden: true }
        - { name: reverted_commit, title: reverted_commit, type: normal, alignContent: left, isHidden: true }
        - { name: missing_responses, title: missing_responses, type: normal, alignContent: left, isHidden: true }
        - { name: pending, title: pending, type: normal, alignContent: left, isHidden: true }
        - { name: reverted_calls, title: reverted_calls, type: normal, alignContent: left, isHidden: true }
        - { name: last_revert_reason, title: last_revert_reason, type: normal, alignContent: left, isHidden: true }
        - { name: last_activity, title: last_activity, type: normal, alignContent: left, isHidden: true }
        - { name: last_activity_at, title: last_activity_at, type: normal, alignContent: left, isHidden: true }
        - { name: as_of_block, title: as_of_block, type: normal, alignContent: left, isHidden: true }
        - { name: through_block, title: through_block, type: normal, alignContent: left, isHidden: true }
