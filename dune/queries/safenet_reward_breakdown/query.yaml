name: "Safenet: Aegis reward periods and verified validator rewards"
description: >
  Per Aegis reward period, as published by the ENS name rewards.safenet-gov.eth (IPFS): SAFE
  allocated, staking rewards, Sentinel grants and KYC-withheld amounts. Per period and validator,
  where verified against safe-fndn/safenet-staking-scripts at a pinned commit (exact per-address
  match with the published payouts): time-weighted stake and self-stake, reward participation,
  eligibility, reward and commission. Generated by `npm run sync:validator-rewards` and
  scripts/record-reward-split.ts. Shared model; not shown on the dashboard. Managed in
  github.com/safe-research/safenet-analytics (docs/metrics/staking.md).
private: false
tags: [safenet]
refresh: none
performance: medium
