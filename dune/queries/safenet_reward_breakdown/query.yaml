name: "Safenet: Aegis reward periods and verified validator rewards"
description: >
  Per Aegis reward period, as published by the ENS name rewards.safenet-gov.eth (IPFS): SAFE
  allocated, staking rewards, Sentinel grants and KYC-withheld amounts. Per period and validator,
  where the commission split derived from the published payouts and chain data reproduces every
  payout: time-weighted stake and self-stake, eligibility, reward, commission and beneficiary.
  Generated by `npm run sync:validator-rewards`. Shared model; not shown on the dashboard. Managed
  in github.com/safe-research/safenet-analytics (docs/metrics/staking.md).
private: false
tags: [safenet]
refresh: none
performance: medium
