name: "Safenet: result breakdown by proposal day (last 30 days)"
description: >
  Safenet production (Aegis): requests of the last 30 days by UTC proposal day and current status:
  unanimous secure, disputed, unanimous insecure, timed out without a verdict, pending. Charter
  chains only. Managed in github.com/safe-research/safenet-analytics
  (docs/metrics/network-and-revenue.md).
private: false
tags: [safenet]
refresh: daily
performance: medium

# Lifecycle colours (docs/metrics/network-and-revenue.md#colours): green secure, yellow disputed,
# red insecure, dark grey timed out (terminal), light grey pending. Stack order keeps green and red
# apart for colour-blind readers; the legend names every status and the table shows the numbers.
visualizations:
  stacked:
    name: Requests by proposal day and current status
    type: chart
    options:
      globalSeriesType: column
      series: { stacking: normal }
      sortX: true
      legend: { enabled: true }
      xAxis: { title: { text: Proposal day (UTC) } }
      yAxis:
        - title: { text: Requests }
      columnMapping:
        day: x
        secure_unanimous: y
        disputed: y
        insecure_unanimous: y
        timed_out: y
        pending: y
      seriesOptions:
        secure_unanimous: { type: column, yAxis: 0, zIndex: 0, name: "Secure (unanimous)", color: "#0ca30c" }
        disputed: { type: column, yAxis: 0, zIndex: 1, name: "Disputed (incl. ruled)", color: "#eda100" }
        insecure_unanimous: { type: column, yAxis: 0, zIndex: 2, name: "Insecure (unanimous)", color: "#d03b3b" }
        timed_out: { type: column, yAxis: 0, zIndex: 3, name: "Timed out, no verdict (final)", color: "#6f6e69" }
        pending: { type: column, yAxis: 0, zIndex: 4, name: "Pending (not yet decided)", color: "#b5b3ab" }
  table:
    name: Requests by proposal day and current status (table)
    type: table
    options:
      itemsPerPage: 30
      columns:
        - { name: day, title: Proposal day (UTC), type: normal, alignContent: left, isHidden: false }
        - { name: requests, title: Requests, type: normal, alignContent: right, isHidden: false }
        - { name: secure_unanimous, title: Secure (unanimous), type: normal, alignContent: right, isHidden: false }
        - { name: disputed, title: Disputed, type: normal, alignContent: right, isHidden: false }
        - { name: disputed_awaiting_ruling, title: "of which awaiting ruling", type: normal, alignContent: right, isHidden: false }
        - { name: insecure_unanimous, title: Insecure (unanimous), type: normal, alignContent: right, isHidden: false }
        - { name: timed_out, title: Timed out (final), type: normal, alignContent: right, isHidden: false }
        - { name: pending, title: Pending, type: normal, alignContent: right, isHidden: false }
        - { name: through_block, title: through_block, type: normal, alignContent: left, isHidden: true }
