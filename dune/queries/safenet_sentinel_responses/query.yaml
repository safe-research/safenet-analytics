name: "Safenet: Sentinel responses per request"
description: >
  Safenet production (Aegis): one row per request and eligible or committed Sentinel, with the response state (secure, insecure, missing response, no commit, pending), fee reward and slash per the contract rules.
  Read by the Sentinel queries; not shown on the dashboard. Managed in
  github.com/safe-research/safenet-analytics (docs/metrics/sentinels.md).
private: false
tags: [safenet]
# Executed as part of the queries that read it, so it needs no schedule of its own.
refresh: none
performance: medium
