name: "Safenet: staking now"
description: >
  Safenet Staking on Ethereum, current state: active stake, stakers with active stake, outstanding
  withdrawals (waiting and claimable), stake on deregistered validators, and data freshness.
  Independent of the history charts. Managed in github.com/safe-research/safenet-analytics
  (docs/metrics/staking.md).
private: false
tags: [safenet]
refresh: daily
performance: medium

visualizations:
  active_stake:
    name: Active stake now (SAFE)
    type: counter
    options: { counterColName: active_stake, rowNumber: 1, stringDecimal: 0, counterLabel: Active stake now (SAFE) }
  stakers:
    name: Stakers with active stake now
    type: counter
    options: { counterColName: active_stakers, rowNumber: 1, stringDecimal: 0, counterLabel: Stakers with active stake now }
  outstanding:
    name: Outstanding withdrawals now (SAFE)
    type: counter
    options: { counterColName: outstanding_withdrawals, rowNumber: 1, stringDecimal: 0, counterLabel: "Outstanding withdrawals now (SAFE, waiting + claimable)" }
  claimable:
    name: Claimable withdrawals now (SAFE)
    type: counter
    options: { counterColName: claimable_withdrawals, rowNumber: 1, stringDecimal: 0, counterLabel: "of which claimable now (SAFE)" }
  freshness:
    name: Staking data as of
    type: table
    options:
      itemsPerPage: 1
      columns:
        - { name: as_of_time, title: Ethereum data as of (UTC), type: normal, alignContent: left, isHidden: false }
        - { name: through_block, title: Block, type: normal, alignContent: left, isHidden: false }
        - { name: computed_at, title: Computed (UTC), type: normal, alignContent: left, isHidden: false }
