name: "Safenet: transaction checks per day"
description: >
  Safenet production (Aegis, Gnosis Chain): transaction-check requests, completed checks
  (approved or denied verdicts) and attestations per UTC day for the last 30 days, with the
  all-time request total, with requests for Safes on chains outside the Charter (likely tests) and timeouts
  in separate columns. Managed in github.com/safe-research/safenet-analytics
  (docs/metrics/transaction-checks.md).
private: false
tags: [safenet]
refresh: daily
performance: medium

visualizations:
  daily_chart:
    name: Requests and completed results per day (last 30 days)
    type: chart
    options:
      globalSeriesType: column
      sortX: true
      legend: { enabled: true }
      xAxis: { title: { text: "Day (UTC)" } }
      yAxis:
        - title: { text: Transactions }
      columnMapping:
        day: x
        requests: y
        completed_checks: y
      seriesOptions:
        requests: { type: column, yAxis: 0, zIndex: 0, name: Requests, color: "#2a78d6" }
        completed_checks: { type: column, yAxis: 0, zIndex: 1, name: Completed results, color: "#eb6834" }

  total_requests:
    name: Requests (all time)
    type: counter
    description: >
      Transaction-check requests for Safes on Charter chains since the first production request
      (2026-10-14), up to the latest execution. Same execution as the daily chart.
    options:
      counterColName: requests_cumulative
      rowNumber: 1
      stringDecimal: 0
      counterLabel: Requests (all time)
