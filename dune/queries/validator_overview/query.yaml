        - { name: total_stake, title: total_stake, type: normal, alignContent: left, isHidden: true }
        - { name: share_of_contract_stake, title: share_of_contract_stake, type: normal, alignContent: left, isHidden: true }
        - { name: share_of_live_set_stake, title: share_of_live_set_stake, type: normal, alignContent: left, isHidden: true }
