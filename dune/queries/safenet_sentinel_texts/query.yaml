name: "Safenet: Sentinel reasons and arbitration context"
description: >
  Safenet production (Aegis): the text recorded with Sentinel reveals (reason) and arbitration
  outcomes (the arbitrator's context), decoded from raw logs of the SentinelOracle. Read by the
  Sentinel queries; not shown on the dashboard. Temporary until Dune decodes the contracts
  (docs/decoding.md). Managed in github.com/safe-research/safenet-analytics
  (docs/metrics/sentinels.md).
private: false
tags: [safenet]
# Executed as part of the queries that read it, so it needs no schedule of its own.
refresh: none
performance: medium
