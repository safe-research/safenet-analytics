name: "Safenet: Sentinel participation per day"
description: >
  Safenet production (Aegis): each Sentinel's daily participation rate (valid reveals / eligible
  requests with a closed response window) over the last 30 UTC days. Days without eligible
  requests are blank. Managed in github.com/safe-research/safenet-analytics
  (docs/metrics/sentinels.md).
private: false
tags: [safenet]
refresh: daily
performance: medium

visualizations:
  heatmap:
    name: Participation per day, % of eligible requests (last 30 days)
    type: pivot
    description: >
      One row per Sentinel. Blank: the Sentinel was not eligible for any request that day (not a
      member, or no requests). Response window open: not counted yet.
    # Dune's pivot format, as its editor stores it. PivotTable.js-style options (cols, vals,
    # rendererName, ...) crash Dune's renderer; see docs/adding-a-metric.md#visualization-options.
    # Dune's pivot has no heatmap colouring; the key stays `heatmap` to keep the visualization ID.
    options:
      rows: [{ column_name: sentinel }]
      columns: [{ column_name: day }]
      values: [{ column_name: participation_pct, agg_type: AVG, numberFormat: "0.0" }]
