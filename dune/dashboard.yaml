# The Safenet dashboard: https://dune.com/safe/safenet
# Layout uses a 6-column grid. Widgets must not overlap (checked by `npm run validate`).
# Previews (docs/preview.md) use this layout below a banner.
name: Safenet
slug: safenet
private: false
tags: [safenet, safe]

widgets:
  - text_file: text/intro.md
    position: { row: 0, col: 0, size_x: 6, size_y: 3 }

  # ---- Network & revenue ----
  - text_file: text/network_revenue.md
    position: { row: 3, col: 0, size_x: 4, size_y: 3 }
  - visualization: network_summary/freshness
    position: { row: 3, col: 4, size_x: 2, size_y: 3 }

  # Headline counters (all time)
  - visualization: transaction_checks_daily/total_requests
    position: { row: 6, col: 0, size_x: 2, size_y: 3 }
  - visualization: network_summary/completed_results
    position: { row: 6, col: 2, size_x: 2, size_y: 3 }
  - visualization: network_summary/attestations
    position: { row: 6, col: 4, size_x: 2, size_y: 3 }
  - visualization: network_summary/safes_checked
    position: { row: 9, col: 0, size_x: 2, size_y: 3 }
  - visualization: guard_adoption/counter
    position: { row: 9, col: 2, size_x: 2, size_y: 3 }
  - visualization: network_summary/gross_fees
    position: { row: 9, col: 4, size_x: 2, size_y: 3 }

  - visualization: network_summary/windows
    position: { row: 12, col: 0, size_x: 6, size_y: 5 }

  # Activity and results (last 30 days)
  - visualization: transaction_checks_daily/daily_chart
    position: { row: 17, col: 0, size_x: 3, size_y: 8 }
  - visualization: results_daily/stacked
    position: { row: 17, col: 3, size_x: 3, size_y: 8 }
  - visualization: results_daily/table
    position: { row: 25, col: 0, size_x: 6, size_y: 6 }

  # Networks
  - visualization: network_breakdown/bars
    position: { row: 31, col: 0, size_x: 3, size_y: 7 }
  - visualization: guard_adoption/table
    position: { row: 31, col: 3, size_x: 3, size_y: 7 }
  - visualization: network_breakdown/table
    position: { row: 38, col: 0, size_x: 6, size_y: 5 }

  # Revenue
  - visualization: fee_revenue_daily/daily
    position: { row: 43, col: 0, size_x: 3, size_y: 8 }
  - visualization: fee_revenue_daily/cumulative
    position: { row: 43, col: 3, size_x: 3, size_y: 8 }
  - visualization: fee_allocation/table
    position: { row: 51, col: 0, size_x: 6, size_y: 11 }
  - visualization: fee_config/table
    position: { row: 62, col: 0, size_x: 6, size_y: 4 }

  - text_file: text/definitions.md
    position: { row: 66, col: 0, size_x: 6, size_y: 8 }

  - visualization: latest_requests/table
    position: { row: 74, col: 0, size_x: 6, size_y: 10 }
