# Safenet — Network & revenue: https://dune.com/safe/safenet-network-revenue
# Transaction checks, results, networks, Guard-enabled Safes, fees, fee allocation and the latest
# requests. Linked from the overview (overview.yaml); the navigation bar at the top and bottom links
# back to it and to the other sections.
# Layout uses a 6-column grid. Widgets must not overlap (checked by `npm run validate`).
name: Safenet — Network & revenue
slug: safenet-network-revenue
private: false
tags: [safenet, safe]

