    position: { row: 41, col: 0, size_x: 4, size_y: 6 }
  - visualization: arbitration_resolution/open
    position: { row: 41, col: 4, size_x: 2, size_y: 3 }
  - visualization: arbitration_resolution/oldest_open
    position: { row: 44, col: 4, size_x: 2, size_y: 3 }
  - visualization: arbitration_windows/table
    position: { row: 47, col: 0, size_x: 6, size_y: 5 }
  - visualization: arbitration_daily/chart
    position: { row: 52, col: 0, size_x: 3, size_y: 8 }
  - visualization: sentinel_disputes/durations
    position: { row: 52, col: 3, size_x: 3, size_y: 8 }
  - visualization: arbitration_resolution/table
    position: { row: 60, col: 0, size_x: 6, size_y: 4 }
  - visualization: sentinel_disputes/table
    position: { row: 64, col: 0, size_x: 6, size_y: 10 }

