name: Sync rewards

# Looks for newly published staking rewards: the ENS name rewards.safenet-gov.eth pins each rewards DB
# on IPFS, one fixed two-week period at a time (docs/metrics/staking.md#realized-apr). When the sync
# changes the generated data, it pushes a branch and opens a pull request, then starts its checks and
# preview. Nothing reaches production without review and merge. The sync also derives the commission
# split from the published payouts and chain data (docs/metrics/staking.md#commission-split).
#
# It pushes only its own rewards-sync/* branch, with GITHUB_TOKEN, never main: no deploy key, because
# main's ruleset lets every write deploy key bypass it (docs/setup.md). Pushes and pull requests made
# with GITHUB_TOKEN do not trigger workflows, so Validate and Preview are dispatched explicitly.
# Setup (docs/setup.md#rewards-sync): "Allow GitHub Actions to create and approve pull requests"
# under Settings → Actions → General.

on:
  schedule:
    - cron: "47 4 * * *" # daily, 04:47 UTC, before Refresh (05:17)
  workflow_dispatch:

concurrency:
  group: rewards-sync
  cancel-in-progress: false

permissions:
  contents: write # the rewards-sync/* branch only
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GNOSIS_RPC_URL: ${{ secrets.GNOSIS_RPC_URL }}
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Sync published rewards (Beta from safenet-data git, Aegis from ENS → IPFS)
        run: |
          npm run -s sync:validator-rewards | tee "$RUNNER_TEMP/sync.txt"
          npm run -s sync:sentinel-rewards | tee -a "$RUNNER_TEMP/sync.txt"

      - name: Open or update the pull request
        run: |
          if git diff --quiet; then echo "No new published rewards."; exit 0; fi
          root=$(node -e 'const d=require("./dune/data/validator-rewards.json"); const r=d.roots.at(-1); console.log(r.rewards_until.slice(0,10) + "-" + r.merkle_root.slice(2,10))')
          branch="rewards-sync/$root"
          npm run typecheck && npm test && npm run validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A dune
          git commit -m "Sync published rewards through $root"
          # A branch of a previous run for the same root is replaced: the sync is deterministic.
          case "$branch" in rewards-sync/*) ;; *) echo "refusing to push $branch"; exit 1 ;; esac
          git push --force origin "HEAD:refs/heads/$branch"
          {
            echo "Automated sync of the published staking rewards (\`.github/workflows/sync-rewards.yml\`)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/sync.txt"
            echo '```'
            echo
            echo "Before merging, check the preview and \`verify:rewards-apr\` in its comment."
            echo
            echo "If the output above says *commission split not derivable*, the published payouts could not be reproduced (for example, the reward rules changed): the dashboards then show the pool APR and the APR on all stake, and per-validator rewards and the delegator APR read *split not verified* (docs/metrics/staking.md#commission-split)."
          } > "$RUNNER_TEMP/body.md"
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" --title "Sync published rewards through $root" --body-file "$RUNNER_TEMP/body.md"
            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          else
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md"
          fi
          gh workflow run validate.yml --ref "$branch"
          gh workflow run preview.yml --ref main -f pr="$pr"
          echo "Pull request #$pr" >> "$GITHUB_STEP_SUMMARY"
